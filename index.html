/* ========== CENÁRIO NOTURNO (pré-renderizado) ========== */
function camada(largura, altura, cor, minH, maxH, janelas, brilho) {
  const o = document.createElement('canvas'); o.width = largura; o.height = altura;
  const g = o.getContext('2d');
  let x = 0;
  while (x < largura) {
    const w = 40 + Math.random() * 50, h = minH + Math.random() * (maxH - minH);
    g.fillStyle = cor; g.fillRect(x, altura - h, w, h);
    for (let wy = altura - h + 10; wy < altura - 8; wy += 14)
      for (let wx = x + 6; wx < x + w - 8; wx += 12)
        if (Math.random() < janelas) {
          g.fillStyle = Math.random() < .8 ? '#d6aa62' : '#6fc3d6';
          g.shadowColor = g.fillStyle; g.shadowBlur = brilho;
          g.fillRect(wx, wy, 5, 7);
        }
    g.shadowBlur = 0; x += w + 2;
  }
  return o;
}
const TILE = 800;
const ceu = (() => {
  const o = document.createElement('canvas'); o.width = CFG.W; o.height = CFG.H;
  const g = o.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, CFG.H);
  grad.addColorStop(0, '#050618'); grad.addColorStop(.55, '#1b1450'); grad.addColorStop(1, '#4d2050');
  g.fillStyle = grad; g.fillRect(0, 0, CFG.W, CFG.H);
  for (let i = 0; i < 70; i++) {                       // estrelas
    g.globalAlpha = .2 + Math.random() * .5; g.fillStyle = '#fff';
    g.fillRect(Math.random() * CFG.W, Math.random() * CFG.H * .6, 1.5, 1.5);
  }
  g.globalAlpha = 1;
  const lua = g.createRadialGradient(310, 110, 4, 310, 110, 90);  // lua com brilho
  lua.addColorStop(0, '#e6e1c6'); lua.addColorStop(.15, '#d8d2ae'); lua.addColorStop(.16, '#d8d2ae22'); lua.addColorStop(1, '#fff3c400');
  g.fillStyle = lua; g.fillRect(200, 0, 200, 220);
  return o;
})();
const longe = camada(TILE, 330, '#1a1c45', 90, 230, .35, 2);
const perto = camada(TILE, 220, '#0e1030', 60, 170, .5, 4);

let estado = 'menu', passaro, canos, pontos, recorde = 0, scrollL = 0, scrollP = 0, scrollC = 0;
try { recorde = +localStorage.getItem('recorde') || 0; } catch (e) {}

function reiniciar() {
  passaro = { x: 100, y: CFG.H / 2 - 40, vy: 0, ang: 0 };
  canos = []; pontos = 0;
  for (let i = 0; i < 3; i++) novoCano(CFG.W + 80 + i * CFG.espacamento);
}
function novoCano(x) {
  const min = 90, max = CFG.H - CFG.alturaChao - CFG.abertura - 90;
  canos.push({ x, topo: min + Math.random() * (max - min), passou: false });
}
function pular() {
  retomaAudio();
  if (estado === 'menu') { reiniciar(); estado = 'play'; }
  if (estado === 'play') { passaro.vy = CFG.pulo; somPulo(); }
  else if (estado === 'over' && morreuEm && performance.now() - morreuEm > 500) { reiniciar(); estado = 'menu'; }
}
let morreuEm = 0;
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!e.repeat) pular();
  }
});
addEventListener('keyup', e => { if (e.code === 'Space') e.preventDefault(); });

const VOL = { pulo: 1, pancada: .9 };
let ac = null, bufPulo = null;
try {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const bin = atob(AUDIO_PULO.split(',')[1]), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  ac.decodeAudioData(bytes.buffer, d => { bufPulo = d; }, () => {});
} catch (e) {}
function retomaAudio() { if (ac && ac.state === 'suspended') ac.resume(); }   // navegadores exigem um toque/tecla antes
function toca(buf, vol) {
  const src = ac.createBufferSource(), g = ac.createGain();
  src.buffer = buf; g.gain.value = vol; src.connect(g); g.connect(ac.destination); src.start();
}
function somPulo() { if (ac && bufPulo) toca(bufPulo, VOL.pulo); }   // vários pulos seguidos se sobrepõem
function somPancada() {                                             // pancada sintetizada: estalo + grave
  if (!ac) return;
  const t = ac.currentTime, v = VOL.pancada;
  const n = ac.createBuffer(1, ac.sampleRate * .25, ac.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const ruido = ac.createBufferSource(), lp = ac.createBiquadFilter(), gr = ac.createGain();
  ruido.buffer = n; lp.type = 'lowpass'; lp.frequency.value = 1800;
  gr.gain.setValueAtTime(v * .9, t); gr.gain.exponentialRampToValueAtTime(.001, t + .22);
  ruido.connect(lp); lp.connect(gr); gr.connect(ac.destination); ruido.start(t);
  const o = ac.createOscillator(), go = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(40, t + .2);
  go.gain.setValueAtTime(v, t); go.gain.exponentialRampToValueAtTime(.001, t + .28);
  o.connect(go); go.connect(ac.destination); o.start(t); o.stop(t + .3);
}

/* ========== COLISÃO (círculo x retângulo) ========== */
function circuloRetangulo(cx, cy, r, rx, ry, rw, rh) {
  const px = Math.max(rx, Math.min(cx, rx + rw));   // ponto mais próximo do retângulo
  const py = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - px, dy = cy - py;
  return dx * dx + dy * dy < r * r;
}
function bateu() {
  const { x, y } = passaro, r = CFG.raioHitbox, chaoY = CFG.H - CFG.alturaChao;
  if (y + r > chaoY) { passaro.y = chaoY - r; return true; }
  for (const c of canos) {
    if (circuloRetangulo(x, y, r, c.x, -1000, CFG.larguraCano, c.topo + 1000)) return true;                              // cano de cima
    if (circuloRetangulo(x, y, r, c.x, c.topo + CFG.abertura, CFG.larguraCano, CFG.H)) return true;                  // cano de baixo
  }
  return false;
}

/* ========== ATUALIZAÇÃO (passo fixo de 1/120 s) ========== */
function passo(dt) {
  scrollL += 12 * dt; scrollP += 35 * dt;
  if (estado === 'menu') { passaro.y = CFG.H / 2 - 40 + Math.sin(performance.now() / 250) * 8; return; }
  if (estado === 'over') {                       // rosto continua caindo até o chão
    const chao = CFG.H - CFG.alturaChao - CFG.raioHitbox;
    if (passaro.y < chao) { passaro.vy += CFG.gravidade * dt; passaro.y = Math.min(chao, passaro.y + passaro.vy * dt); passaro.ang = 1.1; }
    return;
  }
  if (estado !== 'play') return;
  scrollC += CFG.velocidade * dt;
  passaro.vy += CFG.gravidade * dt;
  passaro.y += passaro.vy * dt;
  if (passaro.y < CFG.raioHitbox) { passaro.y = CFG.raioHitbox; if (passaro.vy < 0) passaro.vy = 0; }   // teto
  passaro.ang = Math.max(-.5, Math.min(1.1, passaro.vy / 600));
  for (const c of canos) {
    c.x -= CFG.velocidade * dt;
    if (!c.passou && c.x + CFG.larguraCano < passaro.x) { c.passou = true; pontos++; }
  }
  if (canos[0].x < -CFG.larguraCano - 10) { canos.shift(); novoCano(canos[canos.length - 1].x + CFG.espacamento); }
  if (bateu()) {
    estado = 'over'; morreuEm = performance.now(); somPancada();
    if (pontos > recorde) { recorde = pontos; try { localStorage.setItem('recorde', recorde); } catch (e) {} }
  }
}

/* ========== DESENHO ========== */
function desenhaTile(img, off, y) {
  const x = -(off % TILE);
  ctx.drawImage(img, x, y); ctx.drawImage(img, x + TILE, y);
}
function glow(x, y, raio, cor) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, raio);
  g.addColorStop(0, cor); g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.fillRect(x - raio, y - raio, raio * 2, raio * 2);
}
function desenhaCano(c) {
  const w = CFG.larguraCano, chaoY = CFG.H - CFG.alturaChao, baixoY = c.topo + CFG.abertura;
  ctx.fillStyle = '#10143a'; ctx.strokeStyle = '#46b5c4';
  ctx.lineWidth = 2; ctx.shadowColor = '#46b5c4'; ctx.shadowBlur = 7;
  ctx.fillRect(c.x, -10, w, c.topo + 10);   ctx.strokeRect(c.x, -10, w, c.topo + 10);
  ctx.fillRect(c.x, baixoY, w, chaoY - baixoY); ctx.strokeRect(c.x, baixoY, w, chaoY - baixoY);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffd27a38';              // janelinhas acesas
  for (let wy = 14; wy < c.topo - 8; wy += 22) { ctx.fillRect(c.x + 12, wy, 8, 10); ctx.fillRect(c.x + w - 20, wy, 8, 10); }
  for (let wy = baixoY + 18; wy < chaoY - 8; wy += 22) { ctx.fillRect(c.x + 12, wy, 8, 10); ctx.fillRect(c.x + w - 20, wy, 8, 10); }
}
function desenhaRosto() {
  const { x, y, ang } = passaro, alt = CFG.alturaRosto;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang * .5);
  if (rosto) {                                       // rosto recortado, sem círculo
    const larg = alt * rosto.width / rosto.height;
    ctx.shadowColor = '#00000099'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
    ctx.drawImage(rosto, -larg / 2, -alt / 2, larg, alt);
  } else {                                           // enquanto a foto carrega
    ctx.beginPath(); ctx.arc(0, 0, CFG.raioHitbox + 6, 0, Math.PI * 2);
    ctx.fillStyle = '#f5c27a'; ctx.fill();
  }
  ctx.restore();
}
function texto(t, x, y, tam, cor = '#fff') {
  ctx.font = `700 ${tam}px system-ui, sans-serif`; ctx.textAlign = 'center';
  ctx.lineWidth = 5; ctx.strokeStyle = '#000a'; ctx.strokeText(t, x, y);
  ctx.fillStyle = cor; ctx.fillText(t, x, y);
}
function desenha() {
  ctx.drawImage(ceu, 0, 0, CFG.W, CFG.H);
  desenhaTile(longe, scrollL, CFG.H - CFG.alturaChao - 330 + 30);
  desenhaTile(perto, scrollP, CFG.H - CFG.alturaChao - 220 + 20);
  if (canos) canos.forEach(desenhaCano);
  // chão + postes de luz
  const chaoY = CFG.H - CFG.alturaChao;
  ctx.fillStyle = '#0a0b1f'; ctx.fillRect(0, chaoY, CFG.W, CFG.alturaChao);
  ctx.fillStyle = '#46b5c4'; ctx.fillRect(0, chaoY, CFG.W, 2);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = -1; i < 4; i++) {
    const px = i * 160 - (scrollC % 160) + 40;
    glow(px, chaoY - 52, 64, '#ffb3472e'); glow(px, chaoY - 52, 12, '#ffe9b09a');
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#1b1d44';
  for (let i = -1; i < 4; i++) ctx.fillRect(i * 160 - (scrollC % 160) + 38, chaoY - 52, 4, 52);
  ctx.fillStyle = 'rgba(5, 6, 24, .16)'; ctx.fillRect(0, 0, CFG.W, CFG.H);   // escurece um pouco o cenário
  if (passaro) desenhaRosto();
  // HUD
  if (estado === 'play') texto(pontos, CFG.W / 2, 70, 48);
  if (estado === 'menu') { texto('FLAPPY GU', CFG.W / 2, 175, 42); texto('MARCHA LENTA', CFG.W / 2, 222, 42); texto('toque / espaço para voar', CFG.W / 2, 400, 18); texto('recorde: ' + recorde, CFG.W / 2, 430, 16, '#ffd27a'); }
  if (estado === 'over') { texto('FIM DE JOGO', CFG.W / 2, 220, 36, '#ff6b8a'); texto('pontos: ' + pontos, CFG.W / 2, 270, 22); texto('recorde: ' + recorde, CFG.W / 2, 300, 18, '#ffd27a'); texto('toque para recomeçar', CFG.W / 2, 350, 16); }
}

/* ========== LOOP ========== */
reiniciar();
let ultimo = performance.now(), acum = 0; const DT = 1 / 120;
(function loop(t) {
  acum += Math.min(.05, (t - ultimo) / 1000); ultimo = t;
  while (acum >= DT) { passo(DT); acum -= DT; }
  desenha(); requestAnimationFrame(loop);
})(ultimo);
</script>
</body>
